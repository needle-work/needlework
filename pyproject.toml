[project]
name = "needlework"
version = "0.1.0"
description = "Offline trajectory stitching from images and proprioception: IDM, verifier, stitcher, and diffusion policy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = "==3.10.*"  # the interpreter itself is pinned in .python-version
dependencies = [
    # Learning stack. Exact pins: these set the numerics of every run.
    "torch==2.9.1",
    "torchvision==0.24.1",
    "diffusers==0.11.1", # DDIM scheduler and cosine-with-warmup LR schedule.
    "torchmetrics==1.9.0", # Imported by the DINOv3 torch.hub entry point.
    # Configuration.
    "hydra-core==1.2.0",
    "omegaconf>=2.3",
    # Arrays and storage. zarr v2 format; numcodecs/imagecodecs decode the image chunks.
    "numpy==1.26.4",
    "zarr==2.18.3",
    "numcodecs==0.13.1",
    "imagecodecs>=2025.3.30",
    "scipy>=1.15",
    "scikit-learn>=1.7", # Imported by the DINOv3 torch.hub entry point.
    "tqdm>=4.67",
    "wandb==0.19.11", # Optional run logging, off unless logging.wandb.enabled=true.
    # Robomimic simulation (training-time rollouts and HDF5 metadata). mujoco is pinned
    # because physics results depend on it.
    "mujoco==3.6.0",
    "robosuite",
    "robomimic",
]

[dependency-groups]
dev = [
    "pre-commit==4.5.1",
    "pytest==9.0.2",
    "ruff==0.15.0",
    "uv==0.8.23",                 # The only uv pin; install_deps.sh reads it from here.
]

[tool.uv]
# Training and evaluation require CUDA; only Linux is resolved and supported.
environments = ["sys_platform == 'linux'"]
# DINOv3 (source, Python >=3.11 metadata) is not a Python dependency: install_deps.sh
# checks it out at a pinned commit and it is loaded with torch.hub from that directory.
extra-build-dependencies = { egl-probe = ["cmake<4", "setuptools"] }
# robomimic declares tianshou==0.4.10 and protobuf==3.20.3, which conflict with each
# other. tianshou is an optional import used only by robomimic's own training scripts,
# so it is excluded (a marker that never matches drops the package).
override-dependencies = ["tianshou; sys_platform == 'never'"]

[tool.uv.sources]
robosuite = { git = "https://github.com/ARISE-Initiative/robosuite.git", rev = "aaa8b9b214ce8e77e82926d677b4d61d55e577ab" }
robomimic = { git = "https://github.com/ARISE-Initiative/robomimic.git", rev = "9ce065180dbcc38ddf8fa4218daa2e75b5fdc28a" }

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/needlework"]

# Style guide. `ruff format` is Black-compatible (88 columns, double quotes, spaces).
# `ruff check` enforces import order, naming, modern syntax, and common bug patterns.
# Both run on every commit through .pre-commit-config.yaml.
[tool.ruff]
# The Python target is inferred from project.requires-python.
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
# `import torch.nn.functional as F` is the PyTorch convention.
ignore = ["N812"]

[tool.ruff.lint.isort]
known-first-party = ["needlework"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
